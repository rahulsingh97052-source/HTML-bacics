<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application Form</h1>
<br><br>
    <h2>Personal Detail Section</h2>
    <label for="name">Name</label>
    <input type="text" name="name" id="name" placeholder="Rahul Singh" required>
    <br><br>
    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="rahul123@gmail.com" required>
    <br><br>
    <label for="contact">Contact</label>
    <input type="text" name="contact" id="contact" placeholder="9841565263" required>
    <br><br>
    <label for="gender">Gender</label required>
    <br>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male" value="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="female">
    <br><br>
    <label for="province">Province</label>
    <select name="" id="">
        <option value="" disabled selected>Default</option>
        <option value="Province-1">Province-1</option>
        <option value="Province-2">Province-2</option>
        <option value="Province-3">Province-3</option>
        <option value="Province-4">Province-4</option>
        <option value="Province-5">Province-5</option>
        <option value="Province-6">Province-6</option>
        <option value="Province-7">Province-7</option>
    </select>
    <br><br>

    <h2>Higher Education Section</h2>
    <label for="">Education Level</label>
    <select name="" id="">
        <option value="" disabled selected>Default</option>
        <option value="High school">High School</option>
        <option value="Master Level">Master Level</option>
        <option value="PHD Level">PHD Level</option>
    </select>

    <br><br>

    <h2>Work Experience Section</h2>
    <label for="pcn">Previous Company Name</label>
    <input type="text" name="previous company name" id="pcn" placeholder="LBEF" required>
    <br>
    <label for="">Experience Level</label>
    <select name="" id="">
        <option value="" disabled selected>Default</option>
        <option value="1 year">1 year</option>
        <option value="2 year">2 year</option>
        <option value="3 year">3 year</option>
    </select>

    <br><br>

    <h2>Other Details</h2>
    <label for="cl">Cover Letter</label>
    <br>
    <textarea name="letter" id="cl" rows="10" cols="25" placeholder="write your cover letter here..."></textarea>
    <br><br>
    <label for="cv">CV</label>
    <br>
    <input type="file" name="cv" id="cv" multiple accept=".pdf, .png">

    <br><br>
    <button type="submit">Submit</button>

</body>
</html>

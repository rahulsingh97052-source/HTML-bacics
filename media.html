<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Media in HTML</h1>

    <!-- Audio/video Tag Attributes:
    Controls - gives control to media like play, pause and volume control.
    autoplay - autoplay the media in browser when loaded
    loop - plays the media iteratively
    muted - mutes the media by default-->
    <H2>Audio</H2>
    <audio src="../MEDIA/music.mp3" controls loop autoplay muted></audio>

    <H2>Video</H2>
    <video src="../MEDIA/video.mp4" controls width="300px" autoplay muted loop></video>

    <H2>iFrame</H2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/4O1ol-TKEOc?si=SiNKrYIC1Bs1rjTo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Google Map</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.3794975855253!2d85.3344104!3d27.7055668!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb199ffe9d7c6b%3A0x91b3a969f305a0bc!2sMaitidevi%2C%20Kathmandu%2044600!5e0!3m2!1sen!2snp!4v1786502531100!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>Website</h2>
    <iframe src="https://www.lbef.org/" frameborder="2" width="600px" height="800px"></iframe>

</body>
</html>
